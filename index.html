<html>
    <head>
        <meta charset="UTF-8">
        <title>Dori Sheep Store</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <div class="brand">
                <img src="./assets/logo.png" width="60px" height="60px" id="logo">
                <p>Dori Sheep</p>
            </div> 

            <a href="./index.html">Home</a> 
            <a href="./about.html">About</a> 
            <a href="/products.html">Products</a> 
            <a href="/contact.html">Contact</a>
      
            <button id="modebtn"> Switch mode</button>
            <div class="cart">
                <img src="./assets/cart.png"  width="60px" height="60px" id="cartbtn">
                <p class="cart-number" id="cart-count">0</p>
            </div>
        </header>
        <main>
            <section class="cover">
                <h1>Softer than a sheep's dream</h1>
            </section>

            <section>
                <div id="cart-modal" class="cart-modal">
                    <div class="cart-content"> 
                        <h2>Cart</h2>
                        <button id="close">X</button>
                        <div id="cart-items"></div>
                        <h3 id="total-price">Total: $0 </h3>
                        <form id="contact-form">
                            <h3>Please fill in your information</h3>
                            <input type="text" id="customer-name" placeholder="Enter your name" required> <br>
                            <input type="tel" id="customer-phone" placeholder="Enter your phone number" required> <br>
                            <input type="text" id="customer-address" placeholder="Enter your address" required> <br>
                            <textarea id="customer-note" placeholder ="Enter your note (optional)"></textarea> <br>
                            <input type="submit" value="Buy now!"> 
                        </form>
                    </div>
                </div>

            </section>          
        </main>
        <footer class="info">
            <h1>Information</h1>
            <div class="footer">
                <p>Adress: 793/55/10/9 Tran Xuan Soan</p>
                <p>Email: han.nguyenhoangminh.ketdoan@gmail.com</p>
                <p>Phone number: 0988138953</p>
                <p>Opening hours: Mon - Sat (9h - 20h)</p>
            </div>
        </footer>
        <script type="module" src="script.js"></script>
    </body>
    
</html>
