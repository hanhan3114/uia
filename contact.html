<html>
    <head>
        <meta charset="UTF-8">
        <title>Dori Sheep Store</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <div class="brand">
                <img src="./assets/logo.png" width="90px" height="90px" id="logo">
                <p>Dori Sheep</p>
            </div> 
            <a href="./index.html">Home</a> 
            <a href="./about.html">About</a> 
            <a href="/products.html">Products</a> 
            <a href="/contact.html">Contact</a>
            <button id="modebtn"> Switch mode</button>
            <div class="cart">
                <img src="./assets/cart.png"  width="40px" height="40px">
                <p class="cart-number">0</p>
            </div>
        </header>
        <main>
            <section class="contact">
                <form>
                    <h1>Contact us</h1>
                    <input type="text" placeholder="Enter your name"> <br>
                    <input type="tel" placeholder="Enter your phone number"> <br>
                    <input type="text" placeholder="Enter your email"> <br>
                    <textarea placeholder="Enter your message"></textarea> <br>
                    <input type="submit" value="Send"> 
                </form>
            </section>
        </main>
    </body>
</html>
