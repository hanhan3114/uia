<html>
    <head>
        <meta charset="UTF-8">
        <title>Dori Sheep Store</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6W9Q89X4CW"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-6W9Q89X4CW');

    <body>
        <header>
            <div class="brand">
                <img src="./assets/logo.png" width="80px" height="80px" id="logo">
                <p>Dori Sheep</p>
            </div> 

            <a href="./index.html">Home</a> 
            <a href="./about.html">About</a> 
            <a href="/products.html">Products</a> 
            <a href="/contact.html">Contact</a>
      
            <button id="modebtn"> Switch mode</button>
            <div class="cart">
                <img src="./assets/cart.png"  width="50px" height="50px" id="cartbtn">
                <p class="cart-number" id="cart-count">0</p>
            </div>
        </header>
        <main>
            <section class="contact">
                <form id="contact-form">
                    <h1>Contact us</h1>
                    <input type="text" id="contact-name" placeholder="Enter your name"> <br>
                    <input type="tel" id="contact-phone" placeholder="Enter your phone number"> <br>
                    <input type="text" id="contact-email" placeholder="Enter your email"> <br>
                    <textarea id="contact-message" placeholder ="Enter your message"></textarea> <br>
                    <input type="submit" value="Send"> 
                </form>
            </section>
            <section class="map">
                <h1> Visit us</h1>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3919.841121863814!2d106.69778014887062!3d10.746725412814733!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31752f7518b21edd%3A0x59d18ec808a06188!2zNzkzLzU1LzIwLzUgxJAuIFRy4bqnbiBYdcOibiBTb-G6oW4sIFTDom4gSMawbmcsIFF14bqtbiA3LCBUaMOgbmggcGjhu5EgSOG7kyBDaMOtIE1pbmgsIFZpZXRuYW0!5e0!3m2!1sen!2s!4v1772882105775!5m2!1sen!2s" 
                width="600" 
                height="450"
                style="border:0;"
                allowfullscreen=""
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
            </section>
            <section>
                <div id="cart-modal" class="cart-modal">
                    <div class="cart-content"> 
                        <h2>Cart</h2>
                        <button id="close">X</button>
                        <div id="cart-items"></div>
                        <h3 id="total-price">Total: $0 </h3>
                        <form id="order-form">
                            <h3>Please fill in your information</h3>
                            <input type="text" id="customer-name" placeholder="Enter your name" required> <br>
                            <input type="tel" id="customer-phone" placeholder="Enter your phone number" required> <br>
                            <input type="text" id="customer-address" placeholder="Enter your address" required> <br>
                            <textarea id="customer-note" placeholder ="Enter your note (optional)"></textarea> <br>
                            <input type="submit" value="Buy now!"> 
                        </form>
                    </div>
                </div>
            </section> 
        </main>
        <footer class="info">
            <h1>Information</h1>
            <div class="footer">
                <p>Adress: 793/55/10/9 Tran Xuan Soan</p>
                <p>Email: han.nguyenhoangminh.ketdoan@gmail.com</p>
                <p>Phone number: 0988138953</p>
                <p>Opening hours: Mon - Sat (9h - 20h)</p>
            </div>
        </footer>
        <script type="module" src="script.js"></script>
    </body>
</html>
